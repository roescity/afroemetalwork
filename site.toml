dimensions = "36″ × 36″ × 27″"
year = "2008"
description = """
Fire has always fascinated me and elicits a primal desire to find warmth both physically and psychologically. Humans are drawn together in community and in support, around fire. I have loved trees in a special way for as long as I can remember. Simultaneously I am drawn to fire. Made of 8 story panels assembled in 4 hinged pairs, the overall firepit can be easily stored off season with only the large fire dish and grate taking any significant space. It strikes me that as flame consumes wood it makes the imagery of these 4 paired panels, ironic.
"""

