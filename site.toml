slug = "marianas"
folder = "Marianas "
title = "Marianas"
materials = "Corten and stainless-steel"
year = "2013"
collection = "In a private collection"
dimensions = ""
description = """
This undulating curving form seems to swim in space and evokes unknown creatures of the deep as might be found in the Marianas Trench. The overall composition is a reworking of the primary elements that were not selected for a competitive commission. If you imagine the force required to bend a sheet of metal in multiple planes you will appreciate the effort employed to bring these three sheets together. Tremendous force and heat were needed all while focusing on the smooth curves and elegant line.
"""
