title = "Firepit — Evolution"
materials = "Mild steel"
dimensions = "36″ × 36″ × 27″"
year = "2008"
description = """
Fire has always fascinated me and elicits a primal desire to find warmth both physically and psychologically. Humans are drawn together in community and in support around fire. The design elements of this firepit highlight the path of life in the oceans moving onto land. Made of 8 story panels assembled in 4 hinged pairs, the overall firepit can be easily stored off season with only the large fire dish and grate taking any significant space.
"""

