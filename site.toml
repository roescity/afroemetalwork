description = """
This piece was inspired by the idea of cleaving forms that face one another with the positive and negative shapes in opposition to each other. The egg form barely balancing on the sloping edge of a fallen form speaks to the precarious nature of all life as the world shifts and changes constantly.
"""

[[projects]]
slug = "summer-reclining"
folder = "Summer Reclining"
title = "Summer Reclining"
materials = "Mild steel"
dimensions = "18″ × 18.5″ × 32.5″"
collection = "In a private collection."
year = "2007"
description = """
Remodeling the deck of our home gave me a new place to imagine compositions of form and texture in metal. While more typically I am excited to compose three dimensionally employing both the positive and negative shapes, this location afforded the chance to “paint in metal”. I was specifically Inspired by Monet’s many reclining nudes in the composition. The stainless area of the implied abdomen spins in space on two pins highlighting the womb as the source of human life.  I found the potential for this format to be exciting and the possibilities unlimited.
"""

[[projects]]
slug = "stump-stool"
folder = "Stump Stool"
title = "Stump Stool"
materials = "Mild steel"
dimensions = "18″ × 18.5″ × 32.5″"
year = "2009"
description = """
My parents grew up in the pan handle of West Texas during the dust bowl. This led them to love the forests of the Pacific Northwest where we eventually landed as a family. This passion for the green lushness of the Douglas fir and cedar trees of the surrounding woods was instilled in me. Trees have an individuality that fascinates; their size, form and texture are a spectacular example of basic elements of design. This stump was a practical reference to trees and one that provided seating around a fire that would not burn! It was constructed of repeated small plasma-cut pieces of pipe tacked and welded onto a larger pipe as a surface decoration. The stainless seating surface insured a clean surface on which to sit and humorously acts as a rain drum in a heavy downpour! 
"""

