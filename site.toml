[[projects]]
slug = "marianas"
folder = "Marianas "
title = "Marianas"
materials = "Corten and stainless steel"
year = "2013"
collection = "Installed in private home"
dimensions = ""
description = """
This undulating curving form seems to swim in space and evokes unknown creatures of the deep as might be found in the Marianas Trench. The overall composition is a reworking of the primary elements that were not selected for a competitive commission. If you imagine the force required to bend a sheet of metal in multiple planes you will appreciate the effort employed to bring these three sheets together. Tremendous force and heat were needed all while focusing on the smooth curves and elegant line.
"""
process_folder = "Marianas process"
process_title = "Marianas in the Studio"
process_intro = "A look inside the studio as Marianas takes shape — from flat sheet steel to the finished form."

[[projects]]
slug = "spirit-uplifting"
folder = "Spirit Uplifting"
title = "Spirit Uplifting"
materials = "Stainless steel and gold leaf; corten steel base"
collection = "Installed in private home"
year = "2011"
exhibited = "The Language of Sculpture, Lake Oswego Festival of the Arts, 2011 · Sculptural Conversations, Bush Barn Art Center, Salem, Oregon, 2012"
description = """
Spirit Uplifting grew out of a series of works exploring the sweeping, twisting lines of stylized flame. As the piece developed it became more abstracted from that starting idea — a form more grounded than fire, yet similarly ethereal.

The sculpture was first worked in clay. From that maquette, patterns were traced, enlarged, and cut from stainless steel — my first piece in that material. The form had to be worked up from the base on all sides at once, each plane drawn gracefully in to its neighbor with tremendous force for fit-up, tacking, and final TIG welding, all while managing the heat distortion that stainless invites. The inside corners could not be welded and cleaned afterward, so they were hammered from wedges and finished in gold leaf. They draw attention to the interior of the form — the spirit emerging from within.

The double-stacked, rotating base is corten steel, chosen for the beauty of its patina and the contrast of that warmth against the cool tones of the stainless form.
"""

[[projects]]
slug = "charis"
folder = "Charis, Bronze Figure"
title = "Charis"
materials = "Silicon bronze; uba tuba granite and corten steel base"
year = "2008"
collection = "Art acquisition, Portland Community College Rock Creek Campus"
description = """
Charis is named for the Greek goddess of charm, beauty, nature, and human creativity — and for the woman photographed by Edward Weston whose image inspired this sculpture. The sinuous lines drawn in space by the intersection of each plane reference the soft flesh of the photographed figure, even as the hard material and reflective surfaces contradict that truth.

The figure is abstracted into four elements fabricated from eighth-inch silicon sheet bronze. The interior surfaces are polished to a mirror finish to highlight the value of the internal beauty in each of us; they bounce light between the elements and reflect the viewer's own image, drawing one closer to the sculpture. The pieces are bolted to a slab of uba tuba stone, which rests atop a corten steel base.
"""

