# ============================================================
#  Series — several works that share one page. Each member keeps its own
#   record and its own card on the home page; only the page is
#  shared. A member needs series, series_title and series_anchor set.
# ============================================================

[[series]]
slug = "firepit-series"
title = "Firepit Series"
cover = "firepit-evolution"
members = [
  "firepit-interconnected",
  "firepit-evolution",
  "firepit-irony",
]
description = """
Fire has always fascinated me, both as a physical source of warmth and as a place around which friends and family gather in community. In these three firepits, a functional object becomes a circular narrative. Cut-steel forms surround the flame with images of evolution, human connection, and the uneasy relationship between trees and fire.
"""

# ============================================================
#  Works, in the order they appear in the gallery.
#  slug      — also names the image folder: docs/images/<slug>/
#  folder    — original photo folder; used only by import_photos.py
#  Photographs come from docs/images/<slug>/: the "primary" pair is the
#  cover and lead image, and 1, 2, 3 … follow in the More views strip.
# ============================================================

[[projects]]
slug = "marianas"
folder = "Marianas "
title = "Marianas"
materials = "Corten and stainless-steel"
year = "2013"
collection = "In a private collection"
dimensions = ""
description = """
Marianas is an undulating form that seems to swim through space, suggesting an unknown creature from the depths of the Mariana Trench. The sculpture grew from elements first developed for a public commission and was ultimately reworked into a different self-contained composition.
Three sheets of Corten steel were brought together into one sinuous curving volume using great clamping force and occasional heat. This effort took place inch by inch working all edges simultaneously until they could be held together with small welded tacks along their full lengths. Finally, each edge was fully welded and ground it to a smooth line. The Corten form was then set upon a stainless-steel base designed to imply a rising wave.  This sculpture requires the viewer to move around it to truly appreciate its form.

"""
process_folder = "Marianas process"
process_title = "Marianas in the Studio"
process_intro = "A look inside the studio as Marianas takes shape — from flat sheet steel to the finished form."

[[projects]]
slug = "spirit-uplifting"
folder = "Spirit Uplifting"
title = "Spirit Uplifting"
materials = "Stainless steel and gold leaf; corten steel base"
dimensions = "18″ × 18.5″ × 32.5″"
collection = "In a private collection."
year = "2011"
exhibited = "The Language of Sculpture, Lake Oswego Festival of the Arts, 2011 · Sculptural Conversations, Bush Barn Art Center, Salem, Oregon, 2012"
description = """
Spirit Uplifting grew out of earlier work exploring the sweeping, twisting forms of stylized flame. As the piece developed it became more abstracted from that starting idea — a form more grounded than fire, yet similarly ethereal.

The sculpture was first worked in clay. From that maquette, patterns were traced, enlarged, and cut from stainless-steel — my first piece in that material. The form had to be worked up from the base on all sides at once, each plane drawn gracefully in to its neighbor with tremendous force for fit-up, tacking, and final TIG welding, all while managing the heat distortion that stainless invites. The inside corners could not be welded and cleaned afterward, so they were hammered from wedges and finished in gold leaf. They draw attention to the interior of the form — the spirit emerging from within.

The double-stacked, rotating base is corten steel, chosen for the beauty of its patina and the contrast of that warmth against the cool tones of the stainless form.
"""

[[projects]]
slug = "charis"
folder = "Charis, Bronze Figure"
title = "Charis"
materials = "Silicon bronze; uba tuba granite and corten steel base"
dimensions = "30″ × 30″ × 62″"
year = "2008"
collection = "Installed in private collection"
description = """
Charis is named for the Greek goddess of charm, beauty, nature, and human creativity — and for the woman photographed by Edward Weston whose image inspired this sculpture. It is my first piece in sheet bronze, as well as the first of the human form.  The composition of the four shapes is designed to move the viewer around and through the form while the highly polished surface surprises the viewer with their own face as they peer within.  The pieces are bolted to a slab of Uba tuba stone, which rests atop a Corten steel base.
"""

[[projects]]
slug = "fireplace"
folder = "Fireplace "
title = "Fireplace"
materials = "Mild steel"
year = "2009"
collection = "In a private collection."
dimensions = "62″ × 94″ × 16″"
description = """
TThis large fireplace, mantle and surround is a free-spirited interpretation of fire and wood. The upright support forms are an obvious reference to flames as they twist and turn back on themselves and seek to consume all that is above.  Both flanking flame forms are welded to a “bead-board” that provides an architectural columnar reference and is a linear counter point to the organic flame shapes.  Spanning the full width of the fireplace above the actual firebox, rondels of end cut logs appear to support the mantle. Made of mild steel painted and then waxed the overall appearance is of bronze. The firebox for storing wood, similarly finished provides the practical support of “feeding the fire”.
"""

[[projects]]
slug = "precarious"
folder = "Precarious"
title = "Precarious"
materials = "Mild steel"
dimensions = "54″ × 38.5″ × 48.5″"
year = "2008"
collection = "Permanent collection, Portland Community College Rock Creek Campus Learning Garden"
exhibited = "Finalist, The Big Rock Garden juried exhibition, Bellingham, Washington, 2008"
description = """
I was inspired to make “Precarious” by the beauty of basalt columns and my imagination of their shifting, shearing and falling with the active forces of the earth’s movement. In each column face I created shapes mirrored negatively in the opposing surface. Balanced on the edge of a sloped fallen block, an egg sits. It reminds the viewer that in the shifting of forces and masses, life is precious and our position precarious. We are left to wonder if this egg, and the life form it contains, will fall, or remain precariously balanced.

"""

[[projects]]
slug = "summer-reclining"
folder = "Summer Reclining"
title = "Summer Reclining"
materials = "Mild steel"
dimensions = "18″ × 18.5″ × 32.5″"
collection = "In a private collection."
year = "2007"
description = """
Remodeling the deck of our home gave me a new place to imagine compositions of form and texture in metal. While more typically I am excited to compose three dimensionally employing both the positive and negative shapes, this location afforded the chance to “paint in metal”. I was specifically inspired by Monet’s many reclining nudes in the composition. The stainless area of the implied abdomen spins in space on two pins highlighting the womb as the source of human life.  I found the potential for this format to be exciting and the possibilities unlimited.
"""

[[projects]]
slug = "stump-stool"
folder = "Stump Stool"
title = "Stump Stool"
materials = "Mild steel"
dimensions = "18″ × 18.5″ × 32.5″"
year = "2009"
description = """
My parents grew up in the pan handle of West Texas during the dust bowl. This led them to love the forests of the Pacific Northwest where we eventually landed as a family. This passion for the green lushness of the Douglas fir and cedar trees of the surrounding woods was instilled in me. Trees have an individuality that fascinates; their size, form and texture are a spectacular example of basic elements of design. This stump was a practical reference to trees and one that provided seating around a fire that would not burn! It was constructed of repeated small plasma-cut pieces of pipe tacked and welded onto a larger pipe as a surface decoration. The stainless seating surface insured a clean surface on which to sit and humorously acts as a rain drum in a heavy downpour! 
"""

[[projects]]
slug = "laminaria"
folder = "Laminaria"
title = "Laminaria"
materials = "Stainless steel"
dimensions = "94″ × 23″ circular base"
year = "2014"
exhibited = "The Allison Inn & Spa Sculpture Invitational, Newberg, Oregon, 2013 · San Juan Island Sculpture Park, Roche Harbor, 2014"
collection = "In a private collection."
description = """
Spending time on the waters of Puget Sound, it is often that one encounters floating beds of kelp. The life sustained within and on these sea-gardens denies the simple beauty of the swaying bands seeking light from the depth, supported by their round float bulbs of bull kelp. I was mesmerized by their swaying dance. In the sculpture, the three entwined ribbons of stainless-steel dance and twist in space creating a whirlpool of energy that is both soothing and stimulating. The tall poles that support each ribbon provide a strong visual line of contrast to the twisting curving forms as they spiral upward. The three discs evoke the float-balls of bull kelp and structurally tie the composition of forms together.

"""

[[projects]]
slug = "tree-trunk-tangle-bench"
folder = "Tree Trunk Tangle Bench"
title = "Tree Trunk Tangle Bench"
materials = "Corten and stainless-steel"
dimensions = "90″ × 55″ × 34.5″"
year = "2010"
exhibited = "Lake Oswego Festival of the Arts, 2011 · 9th Around Oregon Annual, Corvallis, 2011 · The Allison Inn & Spa Sculpture Invitational, 2013"
collection = "In a private collection."
description = """
A finalist for a community bench, Tree Trunk Tangle bench was inspired by the tangle of logs that are often found as the swollen rivers subside after the spring rains and early snow melt. It is a contrast of rounded and rectangular forms, rusted patina and stainless steel.  The composition combines weathering and stainless-steels making maintenance minimal and the complementary color tones aesthetically rich.
"""

[[projects]]
slug = "susies-gate"
folder = "Susie's gate"
title = "Susie's Gate"
materials = "Mild steel with black powder coating"
dimensions = "105.25″ × 40″ × 5″"
collection = "In a private collection."
year = "2020"
description = """
This is a commissioned piece for a client to secure her front entry area where she displays art and artifacts from around the world. The challenge was to design forms that created sufficiently small openings to limit entry, maintain sufficient light to see and simultaneously create shapes that were interesting and organic enough to reflect the feeling of the rural environment. There was additional need to maintain an abstraction of form to avoid conflict with the collection of items on display within. The gate can be locked with a deadbolt and swings effortlessly to a soft rubber stop.
"""

[[projects]]
slug = "turban-man"
folder = "Turban Man"
title = "Turban Man"
materials = "Mild steel"
dimensions = "18″ × 18.5″ × 32.5″"
year = "2009"
description = """
This man was a singular form launching from the faces worked for the firepit “Interconnected”. In the immediate frenzy following 9/11 and other moments where issues of immigration allowed intelligent, caring people to “other” anyone that seemed “different”.  I wanted to present a turbaned face looking back in challenge; daring anyone to see anything but another human with the universal desires and dreams that we all share. 
"""

[[projects]]
slug = "16th-street"
folder = "16th Street"
title = "16th Street Railing"
materials = "Mild steel with clear and black powder coating"
dimensions = "43″ × 108″ × 4″"
collection = "In a private collection."
year = "2007"
description = """
This stair railing was a commission by a client for a home looking out over a bay. The descending curve of the solid form evokes the wave action of the water and is in constant interplay with the adjacent voids. The tension between the positive and negative elements frequently shifts and gives tremendous energy to the composition.  The feathers bring to mind the seabirds and eagles that are often seen soaring overhead. The pile of circles and squares tumbled in the bottom corner may suggest a need to take care in one’s descent.
"""

[[projects]]
slug = "august-trunk"
folder = "August Trunk"
title = "August Trunk"
materials = "Mild steel with aliphatic urethane; corten steel base"
year = "2008"
dimensions = "6.5′ high × 5′ wide × 10.5′ long"
collection = "Collection of the City of Lake Oswego, Oregon · People's Choice Award, Gallery Without Walls, 2011"
description = """
This piece was in response to a trip to Africa to see the elephants in the wild. I felt an urgency to do so as they were increasingly being targeted by poachers and their habitat being lost to the expanding needs of humans. This trip resulted in the sculpture where the elephant form is represented as skeletal on one side and abstracted but fleshed forms on the other.

August Trunk stood in downtown Lake Oswego, Oregon from 2009 to 2011 as part of the Gallery Without Walls juried exhibition, where it was voted the People's Choice Award and purchased by the city for its permanent collection. A maquette of the piece was a finalist in the Cedarhurst Biennial Sculpture Competition in Mt. Vernon, Illinois.
"""

[[projects]]
slug = "firepit-evolution"
folder = "Firepit Evolution"
title = "Firepit — Evolution"
series = "firepit-series"
series_title = "Evolution"
series_anchor = "evolution"
materials = "Mild steel"
dimensions = "36″ × 36″ × 27″"
year = "2009"
description = """
The imagery in Evolution traces the movement of life from the oceans onto land. Eight story panels are assembled as four hinged pairs, allowing the surround to fold for off-season storage; only the large fire dish and grate remain separate.
"""

[[projects]]
slug = "firepit-interconnected"
folder = "Firepit Interconnected"
title = "Firepit — Interconnected"
series = "firepit-series"
series_title = "Interconnected"
series_anchor = "interconnected"
materials = "Mild steel"
dimensions = "36″ × 36″ × 36″"
year = "2008"
description = """
Interconnected brings together five faces representing the diversity of the world's peoples. Bands of steel weave the faces together, beginning, breaking, and resuming around the circle to suggest both the beauty of human connection and its fragility in a world marked by conflict.
"""

[[projects]]
slug = "firepit-irony"
folder = "Firepit Irony"
title = "Firepit — Irony"
series = "firepit-series"
series_title = "Irony"
series_anchor = "irony"
materials = "Mild steel"
dimensions = "36″ × 36″ × 27″"
year = "2009"
description = """
I have long been drawn both to trees and to fire. In Irony, flames consume the wood represented in the surrounding panels, setting the function of the object in deliberate contradiction with its imagery. Like Evolution, its eight story panels are assembled as four hinged pairs for storage.
"""

[[projects]]
slug = "lukes-lamp"
folder = "Luke's lamp"
title = "Luke's Lamp"
materials = "Tractor disks, mild steel, crystal doorknobs"
dimensions = "43″ × 108″ × 4″"
year = "2023"
description = """
This lamp was made to commemorate the life of a young man, the son of a friend, who died of cancer in his late twenties. He worked professionally in metal and I assembled two tractor disks with two crystal door knobs with the idea that though this lamp, his light would shine on. 2022.
"""

[[projects]]
slug = "candle-sticks"
folder = "Candle Sticks"
title = "Candlesticks"
materials = "Stainless steel"
dimensions = "10″ × 3″ × 3″ each"
year = "2021"
description = """
Simple rectangles of leftover stainless tubing were assembled to hold tapers. Again, the warmth of the flame is set off by the cool stainless-steel color palette.
"""
